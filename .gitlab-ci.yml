stages:
  - lint
  - test
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

.python-base: &python-base
  image: python:3.11-slim
  before_script:
    - cd tool
    - pip install -e ".[dev]"

lint:
  <<: *python-base
  stage: lint
  script:
    - ruff check yagura/
    - black --check yagura/

test:
  <<: *python-base
  stage: test
  script:
    - pytest tests/ -v
  allow_failure: true  # tests need a real Linux for collectors; this is a smoke gate

release:
  stage: release
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache tar gzip
  script:
    - tar -czf yagura-$CI_COMMIT_TAG.tar.gz tool/ install.sh README.md HOW_IT_WORKS.md LICENSE CHANGELOG.md
  artifacts:
    paths:
      - yagura-*.tar.gz
    expire_in: never
  release:
    name: 'Yagura $CI_COMMIT_TAG'
    description: './CHANGELOG.md'
    tag_name: '$CI_COMMIT_TAG'
    assets:
      links:
        - name: 'yagura-$CI_COMMIT_TAG.tar.gz'
          url: '$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/yagura-$CI_COMMIT_TAG.tar.gz?job=release'
